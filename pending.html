<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pago Pendiente - Andrea Tienda</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-yellow-50 min-h-screen flex items-center justify-center p-4">
  <div class="bg-white rounded-3xl shadow-2xl p-8 max-w-md text-center">
    <div class="w-24 h-24 bg-yellow-100 rounded-full flex items-center justify-center mx-auto mb-6">
      <i class="fas fa-clock text-5xl text-yellow-600"></i>
    </div>
    <h1 class="text-3xl font-black text-gray-900 mb-4">Pago Pendiente</h1>
    <p class="text-gray-600 mb-6 text-lg">
      Tu pago está siendo procesado. Te avisaremos cuando se confirme.
    </p>
    <a href="/" class="inline-block w-full bg-primary hover:bg-red-700 text-white font-bold py-3 px-8 rounded-xl transition-all">
      Volver a la tienda
    </a>
  </div>

</html>
